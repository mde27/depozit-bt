# Cloudflare Pages + D1 — Depozit BT
name = "depozit-bt"
compatibility_date = "2024-11-12"
pages_build_output_dir = "dist"

# Replace database_id after: wrangler d1 create depozit-bt
[[d1_databases]]
binding = "DB"
database_name = "depozit-bt"
database_id = "189e60d5-792e-4df3-b318-f4fbcad73b0b"
migrations_dir = "migrations"

# Set via: wrangler pages secret put JWT_SECRET
# [vars] JWT_SECRET is only for local — never commit real secrets
[vars]
JWT_SECRET = "depozit-bt-dev-secret-change-in-prod"
