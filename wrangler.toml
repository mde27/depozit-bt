# Cloudflare Pages + D1 — Depozit BT
name = "depozit-bt"
compatibility_date = "2024-11-12"
pages_build_output_dir = "dist"

# Replace database_id after: wrangler d1 create depozit-bt
[[d1_databases]]
binding = "DB"
database_name = "depozit-bt"
database_id = "189e60d5-792e-4df3-b318-f4fbcad73b0b"
migrations_dir = "migrations"

# JWT_SECRET is a Pages secret (wrangler pages secret put JWT_SECRET).
# Do NOT put it under [vars] here: that clashes with the secret and blocks deploys.
# For local dev, put JWT_SECRET=... in .dev.vars (gitignored).
